# EMPECS — https://empecs.lunarsystem.co.kr
# 적용: sudo cp nginx/empecs.lunarsystem.co.kr.conf /etc/nginx/sites-available/empecs && sudo nginx -t && sudo systemctl reload nginx
#
# 포트 정리
#   CGMS Admin FE (Next):  63103
#   CGMS BE (Express):     63101
#   MongoDB (호스트):      47011  → empecs/cgms/cgms_be/docker-compose.yml
#
# docker compose: empecs/cgms/cgms_be 에서 실행. MONGO_URI 에 authSource=admin 포함.

server {
    listen 80;
    listen [::]:80;
    server_name empecs.lunarsystem.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name empecs.lunarsystem.co.kr;

    ssl_certificate /etc/letsencrypt/live/empecs.lunarsystem.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empecs.lunarsystem.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location = /logintest.html {
        proxy_pass http://127.0.0.1:63101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /logintest-redirect.html {
        proxy_pass http://127.0.0.1:63101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/callback {
        proxy_pass http://127.0.0.1:63101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:63101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://127.0.0.1:63103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
