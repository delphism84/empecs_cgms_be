# EMPECS CGMS 사용자용 Flutter Web — https://empecsuser.lunarsystem.co.kr
# 백엔드 API는 동일 BE(empecs.lunarsystem.co.kr /api)와 같은 스택 — 앱 컨테이너가 /api 를 프록시
#
# 적용:
#   sudo cp nginx/empecsuser.lunarsystem.co.kr.conf /etc/nginx/sites-available/empecsuser
#   sudo ln -sf /etc/nginx/sites-available/empecsuser /etc/nginx/sites-enabled/empecsuser
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS 최초 발급 (DNS A 레코드 선행):
#   sudo certbot certonly --webroot -w /var/www/html -d empecsuser.lunarsystem.co.kr
#
# Docker: empecs/cgms/cgms_be docker-compose 의 cgms-app-fe → 127.0.0.1:63104

server {
    listen 80;
    listen [::]:80;
    server_name empecsuser.lunarsystem.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name empecsuser.lunarsystem.co.kr;

    ssl_certificate /etc/letsencrypt/live/empecsuser.lunarsystem.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empecsuser.lunarsystem.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:63104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
