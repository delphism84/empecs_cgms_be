# TLS 발급 전 임시: HTTP만 — https://empecsuser.lunarsystem.co.kr (포트 80)
# certbot 후에는 empecsuser.lunarsystem.co.kr.conf 로 교체
#
# sudo cp nginx/empecsuser.lunarsystem.co.kr.http-only.conf /etc/nginx/sites-available/empecsuser
# sudo ln -sf ... sites-enabled/ ; sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name empecsuser.lunarsystem.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:63104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
