<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMPECS 소셜 로그인 테스트</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    .sub { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; margin: 6px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #f5f5f5; }
    .btn.google { border-color: #dadce0; }
    .btn.kakao { background: #fee500; border-color: #fee500; }
    .btn.apple { background: #000; color: #fff; border-color: #000; }
    .result { margin-top: 24px; padding: 16px; background: #f8f9fa; border-radius: 8px; font-size: 13px; word-break: break-all; }
    .result pre { white-space: pre-wrap; margin: 0; }
    .err { color: #c00; }
    .ok { color: #0a0; }
    #tokenArea { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>EMPECS 소셜 로그인 테스트</h1>
  <p class="sub">empecs.lunarsystem.co.kr — BE /api/auth/social/verify 연동</p>

  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
    <div id="googleBtn"></div>
    <a href="#" class="btn google" id="linkGoogle">Google (리다이렉트)</a>
    <a href="#" class="btn kakao" id="btnKakao">Kakao (리다이렉트)</a>
    <button type="button" class="btn apple" id="btnApple">Apple 로그인</button>
  </div>

  <div class="result" id="result" style="display:none">
    <strong>결과</strong>
    <div id="resultBody"></div>
    <div id="tokenArea"></div>
  </div>

  <script>
    const API = ''; // same origin
    const CONFIG = {
      google: { clientId: '962492042457-3m9pqdol4i3dl5dgbj8lp7v289eh1jov.apps.googleusercontent.com' },
      kakao:  { restApiKey: '8545569c066287846abdbe7eb8dd4845' },
      apple:  { clientId: 'com.empecs.cg21.web' }
    };

    function show(obj, isErr) {
      const el = document.getElementById('result');
      const body = document.getElementById('resultBody');
      const tokenArea = document.getElementById('tokenArea');
      el.style.display = 'block';
      body.innerHTML = '<pre class="' + (isErr ? 'err' : 'ok') + '">' + JSON.stringify(obj, null, 2) + '</pre>';
      tokenArea.innerHTML = obj.token ? '<p><strong>JWT:</strong><br><code style="font-size:11px">' + obj.token + '</code></p>' : '';
    }

    function verify(provider, payload) {
      return fetch(API + '/api/auth/social/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(r => r.json());
    }

    // hash에서 token 파싱 (리다이렉트 콜백)
    if (window.location.hash) {
      const m = window.location.hash.match(/#token=([^&]+)/);
      if (m) {
        show({ ok: true, token: m[1], source: 'redirect_callback' });
        history.replaceState(null, '', location.pathname);
      }
    }

    // Google (GSI)
    function initGoogle() {
      if (!window.google?.accounts?.id) return setTimeout(initGoogle, 100);
      google.accounts.id.initialize({
        client_id: CONFIG.google.clientId,
        callback: async (res) => {
          const data = await verify('google', { provider: 'google', idToken: res.credential });
          show(data, !data.ok);
        }
      });
      google.accounts.id.renderButton(document.getElementById('googleBtn'), {
        type: 'standard', size: 'large', text: 'signin_with', shape: 'rectangular'
      });
    }
    initGoogle();

    // Google (리다이렉트)
    const googleRedirect = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + CONFIG.google.clientId +
      '&redirect_uri=' + encodeURIComponent(location.origin + '/api/auth/google/callback') +
      '&response_type=code&scope=openid%20email%20profile';
    document.getElementById('linkGoogle').href = googleRedirect;

    // Kakao (리다이렉트)
    document.getElementById('btnKakao').href =
      'https://kauth.kakao.com/oauth/authorize?client_id=' + CONFIG.kakao.restApiKey +
      '&redirect_uri=' + encodeURIComponent(location.origin + '/api/auth/kakao/callback') +
      '&response_type=code';

    // Apple
    document.getElementById('btnApple').onclick = async () => {
      if (!window.AppleID) { show({ error: 'Apple 스크립트 로딩 중' }, true); return; }
      try {
        AppleID.auth.init({
          clientId: CONFIG.apple.clientId,
          scope: 'email name',
          redirectURI: location.origin + '/auth/callback',
          state: 'apple_' + Date.now(),
          usePopup: true
        });
        const { authorization, user } = await AppleID.auth.signIn();
        const idToken = authorization?.id_token;
        if (!idToken) { show({ error: 'Apple id_token 없음' }, true); return; }
        const name = user?.name ? [user.name.firstName, user.name.lastName].filter(Boolean).join(' ') : '';
        const data = await verify('apple', { provider: 'apple', idToken, name: name || undefined });
        show(data, !data.ok);
      } catch (err) {
        show({ error: err?.error || err?.message || String(err) }, true);
      }
    };
  </script>
</body>
</html>
